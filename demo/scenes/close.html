<!doctype html>
<html><head><meta charset="utf-8"><title>close</title><link rel="stylesheet" href="scene.css">
<style>
  .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 34px; }
  .big { font-size: 112px; font-weight: 650; letter-spacing: -0.035em; }
  .tag { font-size: 46px; font-weight: 600; letter-spacing: -0.02em; color: var(--text); }
  .tag span { margin: 0 14px; }
  .meta { margin-top: 26px; display: flex; gap: 22px; font-size: 24px; color: var(--mute); }
  .meta .m { border: 1px solid var(--line2); background: var(--panel); border-radius: 14px; padding: 12px 20px; }
  .badges { display: flex; gap: 14px; margin-top: 8px; }
</style></head>
<body><div class="stage"><div class="grid"></div><div class="glow"></div>
  <div class="center">
    <div class="cue on" style="transition-delay:.1s">
      <svg width="150" height="150" viewBox="0 0 32 32"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a99dff"/><stop offset=".5" stop-color="#6f8bff"/><stop offset="1" stop-color="#38d0ff"/></linearGradient></defs><rect x="1" y="1" width="30" height="30" rx="9" fill="#11131a" stroke="url(#g)" stroke-width="1.2"/><g stroke="url(#g)" stroke-width="2" stroke-linecap="round"><path d="M16 16 L8.5 9"/><path d="M16 16 L23.5 9"/><path d="M16 16 L8.5 23"/><path d="M16 16 L23.5 23"/></g><circle cx="16" cy="16" r="3.6" fill="url(#g)"/><g fill="#11131a" stroke="url(#g)" stroke-width="1.6"><circle cx="8" cy="8.5" r="2.4"/><circle cx="24" cy="8.5" r="2.4"/><circle cx="8" cy="23.5" r="2.4"/><circle cx="24" cy="23.5" r="2.4"/></g></svg>
    </div>
    <div class="big cue" data-cue="name" data-at="0.3">Open<span class="brand-text">Harness</span></div>
    <div class="tag">
      <span class="cue" data-cue="t1" data-at="1.2">Any harness.</span>
      <span class="cue" data-cue="t2" data-at="1.9">Any model.</span>
      <span class="cue brand-text" data-cue="t3" data-at="2.6">Your choice.</span>
    </div>
    <div class="meta cue" data-cue="meta" data-at="3.4">
      <span class="m mono">github.com/chinesepowered/hack-openharness</span>
      <span class="m">Built on HarnessRouter</span>
    </div>
  </div>
</div>
<script src="cues.js"></script>
</body></html>
