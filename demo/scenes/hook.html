<!doctype html>
<html><head><meta charset="utf-8"><title>hook</title><link rel="stylesheet" href="scene.css">
<style>
  .eq { position: absolute; left: 0; right: 0; top: 330px; display: flex; justify-content: center; align-items: center; gap: 34px; }
  .op { font-size: 64px; color: var(--dim); font-weight: 300; }
  .model { border-color: #3b4560; }
  .harness { border-color: #4a3f8f; box-shadow: 0 0 0 0 rgba(139,124,255,0); transition: box-shadow .8s ease, opacity .55s, transform .55s; }
  .harness.hot { box-shadow: 0 0 0 2px #8b7cff, 0 30px 90px -20px rgba(139,124,255,.7); }
  .agent { background: linear-gradient(135deg, rgba(139,124,255,.18), rgba(56,208,255,.14)); border-color: #5a63a8; }
  .label { font-size: 16px; text-transform: uppercase; letter-spacing: .16em; color: var(--dim); font-weight: 600; margin-right: 6px; }
  .val { min-width: 300px; display: inline-block; text-align: center; }
  .val .mono { font-size: 36px; font-weight: 500; }
  .parts { position: absolute; left: 0; right: 0; top: 520px; display: flex; justify-content: center; gap: 22px; }
  .part { border: 1px dashed #4a3f8f; color: #b9b0ff; border-radius: 14px; padding: 12px 22px; font-size: 26px; }
  .tag { position: absolute; left: 0; right: 0; top: 700px; text-align: center; font-size: 58px; font-weight: 600; letter-spacing: -0.02em; }
  .sub { position: absolute; left: 0; right: 0; top: 790px; text-align: center; font-size: 28px; color: var(--mute); }
  .top { position: absolute; left: 80px; top: 64px; }
  .swap { display: inline-block; animation: none; }
  .swapping { animation: flip .5s ease; }
  @keyframes flip { 0% { transform: translateY(0); opacity: 1; } 45% { transform: translateY(-22px); opacity: 0; } 55% { transform: translateY(22px); opacity: 0; } 100% { transform: none; opacity: 1; } }
</style></head>
<body><div class="stage"><div class="grid"></div><div class="glow"></div>
  <div class="top fade on"><span class="logo" style="font-size:34px">
    <svg width="54" height="54" viewBox="0 0 32 32"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a99dff"/><stop offset=".5" stop-color="#6f8bff"/><stop offset="1" stop-color="#38d0ff"/></linearGradient></defs><rect x="1" y="1" width="30" height="30" rx="9" fill="#11131a" stroke="url(#g)" stroke-width="1.5"/><g stroke="url(#g)" stroke-width="2" stroke-linecap="round"><path d="M16 16 L8.5 9"/><path d="M16 16 L23.5 9"/><path d="M16 16 L8.5 23"/><path d="M16 16 L23.5 23"/></g><circle cx="16" cy="16" r="3.6" fill="url(#g)"/><g fill="#11131a" stroke="url(#g)" stroke-width="1.6"><circle cx="8" cy="8.5" r="2.4"/><circle cx="24" cy="8.5" r="2.4"/><circle cx="8" cy="23.5" r="2.4"/><circle cx="24" cy="23.5" r="2.4"/></g></svg>
    <span>Open<span class="brand-text">Harness</span></span></span></div>

  <div class="eq">
    <div class="chip model cue" data-cue="model" data-at="1.2"><span class="label">model</span><span class="val"><span id="m" class="swap mono">gpt-6.1-sol</span></span></div>
    <div class="op cue" data-cue="model" data-at="1.2">+</div>
    <div class="chip harness cue" id="h" data-cue="harness" data-at="2.4"><span class="label">harness</span><span class="val"><span id="hn" class="swap">Claude Code</span></span></div>
    <div class="op cue" data-cue="agent" data-at="0.4">=</div>
    <div class="chip agent cue" data-cue="agent" data-at="0.4">coding agent</div>
  </div>
  <div class="parts">
    <div class="part cue" data-cue="tools" data-at="4">tools</div>
    <div class="part cue" data-cue="prompts" data-at="4.6">system prompts</div>
    <div class="part cue" data-cue="loop" data-at="5.2">agent loop</div>
  </div>
  <div class="tag cue" data-cue="tag" data-at="11">The harness matters <span class="brand-text">just as much.</span></div>
  <div class="sub cue" data-cue="sub" data-at="8">OpenCode lets you swap the model.</div>
</div>
<script>
  const models = ['gpt-6.1-sol', 'claude-opus-5.5', 'qwen3.8-max', 'deepseek-v4-pro', 'gemini-4-argon', 'kimi-k3'];
  const harnesses = ['Claude Code', 'Codex', 'Qwen Code', 'MiniMax Code', 'Gemini CLI', 'OpenCode'];
  function cycle(id, list, every) {
    let i = 0; const el = document.getElementById(id);
    setInterval(() => { i = (i + 1) % list.length; el.classList.remove('swapping'); void el.offsetWidth; el.classList.add('swapping'); setTimeout(() => { el.textContent = list[i]; }, 240); }, every);
  }
  window.onCue = {
    sub: { at: 8, fn: () => cycle('m', models, 900) },
    tag: { at: 11, fn: () => { document.getElementById('h').classList.add('hot'); cycle('hn', harnesses, 900); } },
  };
</script>
<script src="cues.js"></script>
</body></html>
