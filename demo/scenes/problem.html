<!doctype html>
<html><head><meta charset="utf-8"><title>problem</title><link rel="stylesheet" href="scene.css">
<style>
  .term { position: absolute; width: 560px; height: 330px; border-radius: 16px; background: #0c0e13; border: 1px solid var(--line2); box-shadow: 0 40px 90px -30px rgba(0,0,0,.9); overflow: hidden; }
  .bar { height: 46px; display: flex; align-items: center; gap: 10px; padding: 0 16px; background: #151821; border-bottom: 1px solid var(--line); }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: #2a3040; }
  .title { margin-left: 10px; display: flex; align-items: center; gap: 10px; font-size: 19px; font-weight: 600; }
  .body { padding: 18px 20px; font-size: 19px; line-height: 1.75; color: #aeb6c6; }
  .body .p { color: var(--dim); }
  .ln { opacity: 0; transition: opacity .3s; }
  .warn { color: #f5b74e; } .err { color: #ff6b7a; } .ok { color: #3fd68f; }
  .caret { display: inline-block; width: 11px; height: 22px; background: #c6ccd8; vertical-align: -4px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .count { position: absolute; left: 0; right: 0; bottom: 90px; text-align: center; font-size: 56px; font-weight: 650; letter-spacing: -0.02em; }
  .shake.jit { animation: shake .5s ease-in-out 4; }
  @keyframes shake { 0%,100% { translate: 0 0; } 25% { translate: -5px 3px; } 75% { translate: 5px -3px; } }
</style></head>
<body><div class="stage"><div class="grid"></div><div class="glow" style="background:rgba(255,107,122,.08)"></div>
<div id="wrap"></div>
<div class="count cue" data-cue="count" data-at="10.5">10 harnesses <span style="color:var(--dim)">=</span> <span style="color:#ff8a96">10 terminals to babysit</span></div>
</div>
<script>
  const H = [
    ['Claude Code', 'CC', '#D97757', 'claude'], ['Codex', 'CX', '#10A37F', 'codex'], ['Qwen Code', 'QW', '#7C6CF6', 'qwen'],
    ['MiniMax Code', 'MM', '#F43F5E', 'minimax'], ['Gemini CLI', 'GE', '#4C8DF6', 'gemini'],
    ['OpenCode', 'OC', '#CBD5E1', 'opencode'], ['Kimi Code', 'KI', '#22D3EE', 'kimi'], ['Grok Build', 'GK', '#E879F9', 'grok'], ['Aider', 'AI', '#84CC16', 'aider'], ['OpenHands', 'OH', '#FACC15', 'openhands'],
  ];
  const pos = [[150, 120, -3], [700, 90, 2], [1240, 140, -2], [380, 470, 2.5], [980, 500, -1.5], [60, 560, 4], [1320, 560, 3], [560, 260, -4], [1120, 300, 1.5], [820, 640, -2.5]];
  const lines = [
    (c) => `<div class="ln"><span class="p">$</span> install ${c}</div>`,
    () => `<div class="ln ok">✓ installed</div>`,
    (c) => `<div class="ln"><span class="p">$</span> ${c} login</div>`,
    () => `<div class="ln warn">? Paste your API key:</div>`,
    () => `<div class="ln"><span class="caret"></span></div>`,
  ];
  const wrap = document.getElementById('wrap');
  H.forEach(([name, mono, color, cmd], i) => {
    const t = document.createElement('div');
    t.className = 'term cue shake';
    t.style.left = pos[i][0] + 'px'; t.style.top = pos[i][1] + 'px'; t.style.setProperty('--r', pos[i][2] + 'deg'); t.style.rotate = pos[i][2] + 'deg';
    t.style.zIndex = 10 + i;
    t.dataset.cue = i < 5 ? 'h' + i : 'more';
    t.dataset.at = i < 5 ? String(0.3 + i * 0.9) : '8.4';
    t.innerHTML = `<div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="title"><span class="badge" style="width:30px;height:30px;font-size:12px;color:${color};background:color-mix(in oklab, ${color} 16%, #0d0f14);box-shadow:inset 0 0 0 1px color-mix(in oklab, ${color} 45%, transparent)">${mono}</span>${name}</span></div>
      <div class="body mono">${lines.map((f) => f(cmd)).join('')}</div>`;
    wrap.appendChild(t);
  });
  // lines type in on the "install / login / way of working" words
  window.onCue = {
    install: { at: 5.2, fn: () => document.querySelectorAll('.term').forEach((t) => { t.querySelectorAll('.ln')[0].style.opacity = 1; setTimeout(() => t.querySelectorAll('.ln')[1].style.opacity = 1, 350); }) },
    login: { at: 6.3, fn: () => document.querySelectorAll('.term').forEach((t) => { t.querySelectorAll('.ln')[2].style.opacity = 1; setTimeout(() => t.querySelectorAll('.ln')[3].style.opacity = 1, 300); setTimeout(() => t.querySelectorAll('.ln')[4].style.opacity = 1, 600); }) },
    more: { at: 8.4, fn: () => setTimeout(() => document.querySelectorAll('.term').forEach((t) => t.classList.add('jit')), 500) },
  };
</script>
<script src="cues.js"></script>
</body></html>
